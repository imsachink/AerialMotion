name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Swift Release
        run: |
          swift --version
          swift build -c release

      - name: Package DMG
        run: |
          make dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v7
        with:
          name: AerialMotion-dmg
          path: AerialMotion.dmg

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} AerialMotion.dmg --clobber || \
          gh release create ${{ github.ref_name }} AerialMotion.dmg \
            --title "AerialMotion ${{ github.ref_name }}" \
            --generate-notes
